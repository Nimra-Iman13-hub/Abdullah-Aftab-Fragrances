<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F8F7F5;
  --beige:#EAE5DE;
  --taupe:#B8AEA2;
  --charcoal:#222222;
  --gold:#C7A56A;
  --gold-light:#E8D5A3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat',sans-serif;
  background:var(--ivory);
  color:var(--charcoal);
  min-height:100vh;
  padding:60px 20px;
}

.checkout-container{
  max-width:900px;
  margin:auto;
}

.checkout-header{
  text-align:center;
  margin-bottom:3rem;
}

.checkout-header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:3.5rem;
  font-weight:300;
}

.checkout-header p{
  margin-top:.5rem;
  color:var(--taupe);
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:.7rem;
}

.gold-line{
  width:60px;
  height:1px;
  background:var(--gold);
  margin:1rem auto;
}

.checkout-box{
  background:#fff;
  padding:3rem;
  box-shadow:0 15px 40px rgba(34,34,34,.08);
  border:1px solid rgba(184,174,162,.2);
}

.checkout-box h2{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  font-weight:300;
  margin-bottom:2rem;
}

.form-group{
  margin-bottom:1.5rem;
}

label{
  display:block;
  margin-bottom:.5rem;
  font-size:.65rem;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--taupe);
}

input,
textarea,
select{
  width:100%;
  padding:1rem;
  border:1px solid rgba(184,174,162,.4);
  background:var(--ivory);
  outline:none;
  font-family:'Montserrat',sans-serif;
  transition:.3s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--gold);
  background:#fff;
}

textarea{
  resize:vertical;
}

.order-summary{
  margin-top:2rem;
  background:var(--beige);
  padding:1.5rem;
  border-left:4px solid var(--gold);
}

.order-summary h3{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;
  margin-bottom:1rem;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:.8rem;
  font-size:.9rem;
}

.total-row{
  margin-top:1rem;
  padding-top:1rem;
  border-top:1px solid rgba(184,174,162,.4);
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:1.1rem;
}

.place-order-btn{
  width:100%;
  margin-top:2rem;
  padding:1rem;
  border:none;
  background:var(--charcoal);
  color:white;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:.7rem;
  transition:.3s;
}

.place-order-btn:hover{
  background:var(--gold);
  color:var(--charcoal);
}

.back-btn{
  display:inline-block;
  margin-bottom:2rem;
  color:var(--taupe);
  text-decoration:none;
  transition:.3s;
}

.back-btn:hover{
  color:var(--gold);
}
</style>
</head>
<body>

<div class="checkout-container">

<a href="index.html" class="back-btn">← Continue Shopping</a>

<div class="checkout-header">
  <h1>Checkout</h1>
  <p>Complete Your Order</p>
  <div class="gold-line"></div>
</div>

<div class="checkout-box">

  <h2>Billing Details</h2>

  <div class="form-group">
    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name">
  </div>

  <div class="form-group">
    <label>Phone Number</label>
    <input type="text" placeholder="03XX XXXXXXX">
  </div>

  <div class="form-group">
    <label>Delivery Address</label>
    <textarea rows="4" placeholder="Enter your complete address"></textarea>
  </div>

  <div class="form-group">
    <label>Payment Method</label>
    <select>
      <option>Cash on Delivery</option>
      <option>EasyPaisa</option>
      <option>JazzCash</option>
      <option>Bank Transfer</option>
    </select>
  </div>

  <div class="order-summary">
    <h3>Order Summary</h3>

    <div id="cart-summary"></div>

    <div class="total-row">
      <span>Total</span>
      <span id="total-price">Rs 0</span>
    </div>
  </div>

  <button class="place-order-btn">
    Place Order
  </button>

</div>

</div>

<script>
const cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartSummary = document.getElementById("cart-summary");
const totalPrice = document.getElementById("total-price");

let total = 0;

cart.forEach(item => {
  total += item.price * item.qty;

  cartSummary.innerHTML += `
    <div class="cart-item">
      <span>${item.name} (${item.size}) × ${item.qty}</span>
      <span>Rs ${(item.price * item.qty).toLocaleString()}</span>
    </div>
  `;
});

totalPrice.textContent = "Rs " + total.toLocaleString();
</script>


</body>
</html>
</body>
</html>
